<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>James Lone | Digital Creator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
    
    body { font-family: 'Inter', sans-serif; }
    .heading { font-family: 'Space Grotesk', sans-serif; }
    .hero-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; opacity: 0.85; }
    
    .nav-link { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    .nav-link:hover { color: #10b981; letter-spacing: 1px; }
    
    button, a {
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="bg-zinc-950 text-white overflow-x-hidden">

  <!-- NAVBAR -->
  <nav class="fixed top-0 w-full z-50 bg-zinc-950/90 backdrop-blur-lg border-b border-white/10">
    <div class="max-w-7xl mx-auto px-6 py-6 flex justify-between items-center">
      <h1 class="text-3xl font-bold tracking-tighter heading">JAMESLONE</h1>
      
      <div class="hidden md:flex items-center gap-10 text-sm uppercase tracking-widest">
        <a href="#home" class="nav-link">Home</a>
        <a href="#about" class="nav-link">About</a>
        <a href="#work" class="nav-link">Work</a>
        <a href="#contact" class="nav-link">Contact</a>
      </div>

      <a href="https://instagram.com/jameslone.dev" target="_blank" 
         class="px-6 py-3 border border-emerald-500/50 hover:border-emerald-500 rounded-full text-sm hover:bg-emerald-500 hover:text-black transition">
        Instagram
      </a>
    </div>
  </nav>

  <!-- HERO -->
  <section id="home" class="min-h-screen relative flex items-center">
    <canvas id="hero-canvas" class="hero-canvas"></canvas>
    
    <div class="max-w-7xl mx-auto px-6 pt-32 pb-20 relative z-10 grid md:grid-cols-2 gap-12 items-center">
      <div class="space-y-8">
        <h1 class="text-6xl md:text-7xl font-bold leading-none heading tracking-tighter">
          HELLO,<br>I'M <span class="text-emerald-400">JAMES</span>
        </h1>
        <p class="text-2xl text-zinc-400">
          UI/UX Designer • Software Engineer • Creative Technologist & Dancer
        </p>
        <p class="text-lg text-zinc-500 max-w-md">
          From Nairobi, turning ideas into beautiful, functional digital experiences and dynamic visual stories.
        </p>
        
        <div class="flex flex-wrap gap-4">
          <a href="#work" 
             class="px-8 py-4 bg-emerald-500 hover:bg-emerald-600 text-black font-semibold rounded-full text-lg hover:scale-105">
            View My Work
          </a>
          <a href="#contact" 
             class="px-8 py-4 border border-white/60 hover:border-white rounded-full text-lg hover:bg-white/10">
            Let's Connect
          </a>
        </div>
      </div>

      <!-- 3D Character -->
      <div class="relative flex justify-center md:justify-end">
        <img id="character" 
             src="https://your-3d-character-image-link.jpg" 
             alt="James Lone" 
             class="w-72 md:w-96 drop-shadow-2xl transition-transform duration-700 hover:scale-105 hover:rotate-3"/>
      </div>
    </div>
  </section>

  <!-- ABOUT, WORK, CONTACT sections remain similar... -->

  <script>
    // Elegant Three.js Animation
    let scene, camera, renderer, mainObject;
    
    function initThree() {
      const canvas = document.getElementById('hero-canvas');
      renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1, 6);

      // Soft lighting
      const ambient = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambient);
      const pointLight = new THREE.PointLight(0x10b981, 2.5, 100);
      pointLight.position.set(5, 8, 5);
      scene.add(pointLight);

      // Main Object - Torus with slow elegant movement
      const geometry = new THREE.TorusGeometry(2.2, 0.8, 32, 100);
      const material = new THREE.MeshPhongMaterial({
        color: 0x10b981,
        emissive: 0x052e16,
        shininess: 80,
        transparent: true,
        opacity: 0.85
      });
      mainObject = new THREE.Mesh(geometry, material);
      scene.add(mainObject);

      function animate() {
        requestAnimationFrame(animate);
        
        // Smooth, minimal movement
        mainObject.rotation.x = Math.sin(Date.now() * 0.0003) * 0.15;
        mainObject.rotation.y += 0.003;
        
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    // GSAP Animations
    window.onload = () => {
      initThree();

      // Hero text animation
      gsap.from("h1", { 
        y: 80, 
        opacity: 0, 
        duration: 1.4, 
        ease: "power4.out" 
      });
      
      gsap.from(".text-2xl", { 
        y: 40, 
        opacity: 0, 
        duration: 1.2, 
        delay: 0.4 
      });

      // Character hover effect
      const character = document.getElementById('character');
      character.addEventListener('mouseenter', () => {
        gsap.to(character, { scale: 1.08, rotation: 6, duration: 0.6, ease: "power2.out" });
      });
      character.addEventListener('mouseleave', () => {
        gsap.to(character, { scale: 1, rotation: 0, duration: 0.6, ease: "power2.out" });
      });
    };
  </script>
</body>
</html>
